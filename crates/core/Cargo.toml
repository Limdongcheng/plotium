[package]
name = "plotium-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Application layer for Plotium: UI-independent state, actions, project I/O, export, and figure integration."

[lib]
name = "plotium_core"
path = "src/lib.rs"

[features]
default = []
datafusion = ["dep:plotium-datafusion"]

[dependencies]
nmr.workspace = true
plotium-data.workspace = true
plotium-datafusion = { workspace = true, optional = true }
plotium-io.workspace = true
plotium-analysis.workspace = true
plotium-processing.workspace = true
plotium-figure.workspace = true
plotium-render = { path = "../render", default-features = false }
num-complex.workspace = true
serde.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
ureq.workspace = true
thiserror.workspace = true
tempfile.workspace = true
directories.workspace = true
uuid.workspace = true
zip.workspace = true
image.workspace = true
base64.workspace = true
pdf-writer.workspace = true
resvg.workspace = true
svg2pdf.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
num-complex.workspace = true
